      width: 36px; height: 36px;
      border-radius: 50%;

    /* Sticky CTA – shown only while the main button is off-screen */
    .sticky-cta {

      inset-inline: 0;
      bottom: 0;
      z-index: 10;

    (function () {
      // ---- Click tracking hook ----------------------------------------------
      // Ready for GA4 / GTM / Meta Pixel: once any of them is added to the page,
      // WhatsApp clicks are reported automatically. Nothing is sent until then.
      function trackWhatsAppClick(location) {
        var payload = { event: 'whatsapp_click', cta_location: location };
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(payload);                                   // Google Tag Manager
        if (typeof window.gtag === 'function') {
          window.gtag('event', 'whatsapp_click', { cta_location: location }); // GA4
        }
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Contact', { cta_location: location });     // Meta Pixel
        }
        if (typeof window.va === 'function') {
          window.va('event', { name: 'whatsapp_click', data: { cta_location: location } }); // Vercel Analytics
        }
        document.dispatchEvent(new CustomEvent('whatsapp:click', { detail: payload }));
      }

        el.addEventListener('click', function () {
          trackWhatsAppClick(el.getAttribute('data-cta-location'));

        sticky.classList.toggle('is-visible', hidden);

        sticky.querySelector('a').tabIndex = hidden ? 0 : -1;
      }, { threshold: [0, 1] }).observe(anchor);
    })();
